# YS TRADING — angel_scanner.yml
# Main scanner workflow with added safety gates.

name: YS Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30,35,40,45,50,55 3 * * 1-5'
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 4-9 * * 1-5'
    - cron: '0,5 10 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    # MENTOR NOTE: Safety timeout to prevent wasting GitHub Action minutes if the script hangs.
    timeout-minutes: 30 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install smartapi-python pyotp requests logzero websocket-client --quiet

      - name: Check market hours (IST)
        id: market_check
        run: |
          python3 -c "
          from datetime import datetime, timezone, timedelta
          import sys
          IST = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(IST)
          mins = now.hour * 60 + now.minute
          # Market window: 9:15 AM to 3:30 PM
          market_open = (9 * 60 + 15) <= mins <= (15 * 60 + 30)
          is_weekday  = now.weekday() < 5
          
          # MENTOR NOTE: We write to a file to ensure the 'if' condition below reads a clean value.
          if market_open and is_weekday:
              print('SCAN=true')
              with open('scan_flag.txt','w') as f: f.write('true')
          else:
              print('SCAN=false')
              with open('scan_flag.txt','w') as f: f.write('false')
          "
          echo "scan_flag=$(cat scan_flag.txt)" >> $GITHUB_OUTPUT

      - name: Run scanner
        # MENTOR NOTE: Runs only if market is open OR if you manually click 'Scan Now'.
        if: steps.market_check.outputs.scan_flag == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ANGEL_API_KEY:        ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE:    ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD:       ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET:    ${{ secrets.ANGEL_TOTP_SECRET }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH:           ${{ github.workspace }}/scripts
        run: python scripts/scanner_core.py
