# YS TRADING — .github/workflows/test_angel.yml
#
# Tests Angel One API connection.
# Run this ONCE after adding your GitHub Secrets.
#
# HOW TO RUN:
#   1. Go to your GitHub repo
#   2. Click Actions tab
#   3. Click "Test Angel One API" in the left sidebar
#   4. Click "Run workflow" button (top right)
#   5. Watch the output — should show all ✅ PASSED
#
# If any test fails, check the error message and fix before proceeding.

name: Test Angel One API

on:
  workflow_dispatch:        # manual trigger only — run when you want
  push:
    paths:
      - 'scripts/angel_api.py'       # auto-run if you change these files
      - 'scripts/symbol_master.py'
      - 'scripts/test_angel.py'
      - '.github/workflows/test_angel.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install smartapi-python pyotp requests logzero --quiet

      - name: Run connection test
        env:
          ANGEL_API_KEY:        ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE:    ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD:       ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET:    ${{ secrets.ANGEL_TOTP_SECRET }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scripts
          python test_angel.py

      - name: Summary
        if: success()
        run: |
          echo "✅ All tests passed — Angel One API is ready for the scanner"

      - name: Failed
        if: failure()
        run: |
          echo "❌ Tests failed — check output above and fix before building scanner"
          echo ""
          echo "Common fixes:"
          echo "  TOTP error    → Visit https://smartapi.angelbroking.com/enable-totp and re-save the token"
          echo "  Login failed  → Check ANGEL_CLIENT_CODE and ANGEL_PASSWORD in GitHub Secrets"
          echo "  API key error → Check ANGEL_API_KEY at smartapi.angelone.in developer portal"
