# ═══════════════════════════════════════════════════════════════
# YS TRADING — MARKET SCANNER (Every 2 minutes, 9:15-11:30 IST)
# File: .github/workflows/market_scanner.yml
# Uses Yahoo Finance — confirmed working server-side
# ═══════════════════════════════════════════════════════════════

name: YS Market Scanner

on:
  schedule:
    # GitHub minimum is every 5 minutes. We run every 5 min.
    # The script itself is fast enough (~90s for 500 stocks).
    # IST 9:15 = UTC 3:45 | IST 11:30 = UTC 6:00
    # Run every 5 min from 3:30 to 6:05 UTC Mon-Fri
    - cron: '30,35 3 * * 1-5'
    - cron: '*/5 4,5 * * 1-5'
    - cron: '0,5 6 * * 1-5'

  # Manual trigger for testing
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/scanner_engine.py
